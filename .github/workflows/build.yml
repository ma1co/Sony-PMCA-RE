# Builds pmca-console and pmca-gui for Windows and Linux, following upstream's workflow.
# macOS is built by build-macos.yml.
#
# Differences from upstream's build.yml: the windows-2019 and macos-10.15 runners and
# Python 3.6 have been retired, so this uses current runners and Python; libusb-win32 is
# fetched through SourceForge's redirect because upstream's mirror is gone; the macOS job
# is handled by build-macos.yml; a Linux job is added (upstream had none); and the
# release step, which relied on the retired `hub` tool, is left to build-macos.yml.

name: Build Windows and Linux

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  PyInstaller:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # needed for "git describe" to find tags
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install libusb (windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # upstream's jaist.dl.sourceforge.net mirror no longer exists; this redirects to a live one
        Invoke-WebRequest https://sourceforge.net/projects/libusb-win32/files/libusb-win32-releases/1.2.6.0/libusb-win32-bin-1.2.6.0.zip/download -UserAgent Wget -OutFile libusb-win32-bin-1.2.6.0.zip
        Expand-Archive libusb-win32-bin-1.2.6.0.zip .
        Move-Item libusb-win32-bin-1.2.6.0\bin\amd64\libusb0.dll .
        echo $env:GITHUB_WORKSPACE | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
    - name: Install libusb (linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libusb-1.0-0
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip list
    - name: Build
      run: |
        python -OO -m PyInstaller pmca-console.spec
        python -OO -m PyInstaller pmca-gui.spec
    - name: Test
      run: |
        dist/pmca-console* -h
        dist/pmca-console* info || true
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: ${{ runner.os }} binaries
        path: dist/*
